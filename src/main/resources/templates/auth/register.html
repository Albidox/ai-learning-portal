<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="auth-panel">
        <p class="small-label" th:text="${registrationRoleLabel}">Student</p>
        <h1 th:text="${registrationHeading}">Create Student Account</h1>

        <form th:action="${registrationAction}" th:object="${registerRequest}" method="post" class="form-stack">
            <div>
                <label for="name" class="form-label">Name</label>
                <input id="name" type="text" th:field="*{name}" class="form-control" required>
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div>
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" th:field="*{email}" class="form-control" required>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div>
                <label for="password" class="form-label">Password</label>
                <input id="password" type="password" th:field="*{password}" class="form-control" required>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div>
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control" required>
                <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <button type="submit" class="primary-button" th:text="${registrationButtonText}">Register</button>
        </form>

        <p class="helper-text">
            Already registered?
            <a th:href="@{/login}">Login</a>
        </p>
    </section>
</main>
</body>
</html>
