<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="auth-panel">
        <p class="small-label">Account</p>
        <h1>Login</h1>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${param.registered}" class="alert alert-success">Registration successful. Please login.</div>
        <div th:if="${param.logout}" class="alert alert-info">You have logged out.</div>
        <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>

        <form th:action="@{/login}" method="post" class="form-stack">
            <div>
                <label for="username" class="form-label">Email</label>
                <input id="username" name="username" type="email" class="form-control" required autofocus>
            </div>

            <div>
                <label for="password" class="form-label">Password</label>
                <input id="password" name="password" type="password" class="form-control" required>
            </div>

            <button type="submit" class="primary-button">Login</button>
        </form>

        <div class="helper-text">
            New account?
            <div class="button-row mt-2">
                <a class="secondary-button inline-button" th:href="@{/register/student}">Student Registration</a>
                <a class="secondary-button inline-button" th:href="@{/register/teacher}">Teacher Registration</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
