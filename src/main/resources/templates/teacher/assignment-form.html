<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Create Assignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="auth-panel wide-panel">
        <p class="small-label">Teacher</p>
        <h1>Create Assignment</h1>

        <form th:action="@{/teacher/assignments}" th:object="${assignmentRequest}" method="post" class="form-stack">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Assignment error</div>
            </div>

            <div>
                <label for="courseId" class="form-label">Course</label>
                <select id="courseId" th:field="*{courseId}" class="form-select" required>
                    <option value="">Select course</option>
                    <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.name}">Java Basics</option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('courseId')}" th:errors="*{courseId}"></div>
            </div>

            <div>
                <label for="title" class="form-label">Assignment Title</label>
                <input id="title" type="text" th:field="*{title}" class="form-control" required>
                <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div>
                <label for="instructions" class="form-label">Instructions</label>
                <textarea id="instructions" th:field="*{instructions}" class="form-control" rows="8" required></textarea>
                <div class="field-error" th:if="${#fields.hasErrors('instructions')}" th:errors="*{instructions}"></div>
            </div>

            <div>
                <label for="dueDate" class="form-label">Due Date</label>
                <input id="dueDate" type="date" th:field="*{dueDate}" class="form-control" required>
                <div class="field-error" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div>
            </div>

            <div>
                <label for="maxMarks" class="form-label">Max Marks</label>
                <input id="maxMarks" type="number" min="1" th:field="*{maxMarks}" class="form-control" required>
                <div class="field-error" th:if="${#fields.hasErrors('maxMarks')}" th:errors="*{maxMarks}"></div>
            </div>

            <label class="checkbox-row">
                <input type="checkbox" th:field="*{active}">
                <span>Active</span>
            </label>

            <div class="button-row">
                <button type="submit" class="primary-button">Create Assignment</button>
                <a class="secondary-button" th:href="@{/teacher/assignments}">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
