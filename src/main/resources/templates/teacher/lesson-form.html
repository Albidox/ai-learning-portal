<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Create Lesson</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="auth-panel wide-panel">
        <p class="small-label">Teacher</p>
        <h1>Create Lesson</h1>

        <form th:action="@{/teacher/lessons}" th:object="${lessonRequest}" method="post" class="form-stack">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Lesson error</div>
            </div>

            <div>
                <label for="subjectId" class="form-label">Subject</label>
                <select id="subjectId" th:field="*{subjectId}" class="form-select" required>
                    <option value="">Select subject</option>
                    <option th:each="subject : ${subjects}"
                            th:value="${subject.id}"
                            th:text="${subject.course.name + ' - ' + subject.name}">
                        Java Basics - Spring Boot
                    </option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('subjectId')}" th:errors="*{subjectId}"></div>
            </div>

            <div>
                <label for="title" class="form-label">Lesson Title</label>
                <input id="title" type="text" th:field="*{title}" class="form-control" required>
                <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div>
                <label for="content" class="form-label">Lesson Content</label>
                <textarea id="content" th:field="*{content}" class="form-control" rows="10" required></textarea>
                <div class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
            </div>

            <div class="button-row">
                <button type="submit" class="primary-button">Save Draft</button>
                <a class="secondary-button" th:href="@{/teacher/lessons}">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
