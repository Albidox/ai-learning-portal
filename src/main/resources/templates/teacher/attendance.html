<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="page-panel">
        <div class="page-header">
            <div>
                <p class="small-label">Teacher</p>
                <h1>Attendance</h1>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/teacher/attendance}" th:object="${attendanceRequest}" method="post" class="form-stack attendance-form">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Attendance error</div>
            </div>

            <div>
                <label for="courseId" class="form-label">Course</label>
                <select id="courseId" th:field="*{courseId}" class="form-select" required>
                    <option value="">Select course</option>
                    <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.name}">Java Basics</option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('courseId')}" th:errors="*{courseId}"></div>
            </div>

            <div>
                <label for="studentId" class="form-label">Student</label>
                <select id="studentId" th:field="*{studentId}" class="form-select" required>
                    <option value="">Select student</option>
                    <option th:each="student : ${students}"
                            th:value="${student.id}"
                            th:text="${student.name + ' - ' + student.email}">
                        Student User
                    </option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></div>
            </div>

            <div>
                <label for="classDate" class="form-label">Class Date</label>
                <input id="classDate" type="date" th:field="*{classDate}" class="form-control" required>
                <div class="field-error" th:if="${#fields.hasErrors('classDate')}" th:errors="*{classDate}"></div>
            </div>

            <div>
                <label for="status" class="form-label">Status</label>
                <select id="status" th:field="*{status}" class="form-select" required>
                    <option value="">Select status</option>
                    <option th:each="attendanceStatus : ${attendanceStatuses}"
                            th:value="${attendanceStatus}"
                            th:text="${attendanceStatus}">
                        PRESENT
                    </option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
            </div>

            <div class="button-row">
                <button type="submit" class="primary-button">Mark Attendance</button>
            </div>
        </form>

        <h2 class="section-title">Recent Attendance</h2>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Course</th>
                    <th>Student</th>
                    <th>Status</th>
                    <th>Marked By</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="attendance : ${recentAttendance}">
                    <td th:text="${attendance.classDate}">2026-08-04</td>
                    <td th:text="${attendance.course.name}">Java Basics</td>
                    <td th:text="${attendance.student.name}">Student User</td>
                    <td>
                        <span class="status-pill present" th:if="${attendance.status.name() == 'PRESENT'}">PRESENT</span>
                        <span class="status-pill absent" th:if="${attendance.status.name() == 'ABSENT'}">ABSENT</span>
                    </td>
                    <td th:text="${attendance.markedByTeacher.name}">Teacher User</td>
                </tr>
                <tr th:if="${#lists.isEmpty(recentAttendance)}">
                    <td colspan="5" class="empty-text">No attendance marked yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
