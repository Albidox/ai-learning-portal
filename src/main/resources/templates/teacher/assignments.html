<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Assignments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="page-panel">
        <div class="page-header">
            <div>
                <p class="small-label">Teacher</p>
                <h1>Assignments</h1>
            </div>
            <a class="primary-button inline-button" th:href="@{/teacher/assignments/new}">New Assignment</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Course</th>
                    <th>Due Date</th>
                    <th>Max Marks</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="assignment : ${assignments}">
                    <td th:text="${assignment.title}">Assignment title</td>
                    <td th:text="${assignment.course.name}">Java Basics</td>
                    <td th:text="${assignment.dueDate}">2026-08-10</td>
                    <td th:text="${assignment.maxMarks}">20</td>
                    <td>
                        <span class="status-pill published" th:if="${assignment.active}">Active</span>
                        <span class="status-pill draft" th:unless="${assignment.active}">Inactive</span>
                    </td>
                    <td>
                        <a class="secondary-button inline-button"
                           th:href="@{/teacher/assignments/{id}/submissions(id=${assignment.id})}">Submissions</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(assignments)}">
                    <td colspan="6" class="empty-text">No assignments found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
