<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Mark Submission</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="auth-panel wide-panel">
        <p class="small-label" th:text="${submission.assignment.title}">Assignment</p>
        <h1>Mark Submission</h1>

        <div class="muted-card detail-box">
            <strong th:text="${submission.student.name}">Student User</strong>
            <span th:text="${submission.student.email}">student@example.test</span>
            <p th:text="${submission.answerText ?: 'No text answer.'}">Answer text</p>
            <a th:if="${submission.originalFileName != null}"
               th:href="@{/files/submissions/{id}(id=${submission.id})}"
               th:text="${submission.originalFileName}">answer.pdf</a>
        </div>

        <form th:action="@{/teacher/submissions/{id}/mark(id=${submission.id})}" th:object="${markRequest}" method="post" class="form-stack">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Mark error</div>
            </div>

            <div>
                <label for="marksAwarded" class="form-label" th:text="'Marks Awarded (Max ' + ${submission.assignment.maxMarks} + ')'">Marks</label>
                <input id="marksAwarded" type="number" min="0" th:max="${submission.assignment.maxMarks}"
                       th:field="*{marksAwarded}" class="form-control" required>
                <div class="field-error" th:if="${#fields.hasErrors('marksAwarded')}" th:errors="*{marksAwarded}"></div>
            </div>

            <div>
                <label for="feedback" class="form-label">Feedback</label>
                <textarea id="feedback" th:field="*{feedback}" class="form-control" rows="5"></textarea>
                <div class="field-error" th:if="${#fields.hasErrors('feedback')}" th:errors="*{feedback}"></div>
            </div>

            <div class="button-row">
                <button type="submit" class="primary-button">Save Marks</button>
                <a class="secondary-button"
                   th:href="@{/teacher/assignments/{id}/submissions(id=${submission.assignment.id})}">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
