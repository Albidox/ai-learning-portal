<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Lessons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="page-panel">
        <div class="page-header">
            <div>
                <p class="small-label">Teacher</p>
                <h1>Lessons</h1>
            </div>
            <a class="primary-button inline-button" th:href="@{/teacher/lessons/new}">New Lesson</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Course</th>
                    <th>Subject</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="lesson : ${lessons}">
                    <td th:text="${lesson.title}">Lesson title</td>
                    <td th:text="${lesson.subject.course.name}">Java Basics</td>
                    <td th:text="${lesson.subject.name}">Spring Boot</td>
                    <td>
                        <span class="status-pill published" th:if="${lesson.published}">Published</span>
                        <span class="status-pill draft" th:unless="${lesson.published}">Draft</span>
                    </td>
                    <td th:text="${lesson.createdAt}">2026-08-04T14:00</td>
                    <td>
                        <form th:if="${!lesson.published}"
                              th:action="@{/teacher/lessons/{id}/publish(id=${lesson.id})}"
                              method="post">
                            <button type="submit" class="secondary-button">Publish</button>
                        </form>
                        <div th:if="${lesson.published}" class="button-row">
                            <a class="secondary-button inline-button"
                               th:href="@{/teacher/lessons/{id}/ai(id=${lesson.id})}">AI</a>
                            <span th:text="${lesson.publishedAt}">Published date</span>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(lessons)}">
                    <td colspan="6" class="empty-text">No lessons found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
