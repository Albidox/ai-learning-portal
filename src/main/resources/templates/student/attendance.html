<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="page-panel">
        <div class="page-header">
            <div>
                <p class="small-label">Student</p>
                <h1>Attendance</h1>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Course</th>
                    <th>Total Classes</th>
                    <th>Present</th>
                    <th>Absent</th>
                    <th>Percentage</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="summary : ${summaries}">
                    <td th:text="${summary.courseName}">Java Basics</td>
                    <td th:text="${summary.totalClasses}">4</td>
                    <td th:text="${summary.presentCount}">3</td>
                    <td th:text="${summary.absentCount}">1</td>
                    <td>
                        <span class="attendance-percent"
                              th:text="${#numbers.formatDecimal(summary.percentage, 1, 2)} + '%'">75.00%</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(summaries)}">
                    <td colspan="5" class="empty-text">No attendance marked yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
