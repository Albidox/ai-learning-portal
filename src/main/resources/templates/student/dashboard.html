<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="dashboard-panel">
        <p class="small-label">Student</p>
        <h1>Student Dashboard</h1>
        <p class="lead">Open your enrolled courses and read teacher published lessons.</p>

        <div class="action-grid">
            <a class="action-card" th:href="@{/student/courses}">
                <strong>My Courses</strong>
                <span>View your courses and lessons.</span>
            </a>
            <a class="action-card" th:href="@{/student/attendance}">
                <strong>Attendance</strong>
                <span>View your attendance percentage.</span>
            </a>
            <a class="action-card" th:href="@{/student/assignments}">
                <strong>Assignments</strong>
                <span>Submit text answer or upload file.</span>
            </a>
            <a class="action-card" th:href="@{/student/courses}">
                <strong>AI Notes</strong>
                <span>Open a lesson to view AI notes and quiz practice.</span>
            </a>
        </div>
    </section>
</main>
</body>
</html>
