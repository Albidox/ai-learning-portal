<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Submit Assignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="auth-panel wide-panel">
        <p class="small-label" th:text="${assignment.course.name}">Course</p>
        <h1 th:text="${assignment.title}">Submit Assignment</h1>
        <p class="helper-text" th:text="'Due: ' + ${assignment.dueDate} + ' | Max Marks: ' + ${assignment.maxMarks}">
            Due date
        </p>
        <article class="assignment-instructions" th:text="${assignment.instructions}">
            Assignment instructions.
        </article>

        <form th:action="@{/student/assignments/{id}/submit(id=${assignment.id})}"
              th:object="${submissionRequest}"
              method="post"
              enctype="multipart/form-data"
              class="form-stack">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Submission error</div>
            </div>

            <div>
                <label for="answerText" class="form-label">Answer Text</label>
                <textarea id="answerText" th:field="*{answerText}" class="form-control" rows="8"></textarea>
                <div class="field-error" th:if="${#fields.hasErrors('answerText')}" th:errors="*{answerText}"></div>
            </div>

            <div>
                <label for="file" class="form-label">Upload File</label>
                <input id="file" type="file" th:field="*{file}" class="form-control">
                <p class="helper-text">Allowed: pdf, docx, txt, png, jpg, jpeg, zip, java.</p>
            </div>

            <div class="button-row">
                <button type="submit" class="primary-button">Submit Assignment</button>
                <a class="secondary-button" th:href="@{/student/assignments}">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
