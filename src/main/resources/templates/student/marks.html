<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Marks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="page-panel">
        <div class="page-header">
            <div>
                <p class="small-label">Student</p>
                <h1>Marks</h1>
            </div>
            <a class="secondary-button inline-button" th:href="@{/student/assignments}">Assignments</a>
        </div>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Course</th>
                    <th>Assignment</th>
                    <th>Submitted</th>
                    <th>Marks</th>
                    <th>Feedback</th>
                    <th>File</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="submission : ${submissions}">
                    <td th:text="${submission.assignment.course.name}">Java Basics</td>
                    <td th:text="${submission.assignment.title}">Assignment title</td>
                    <td th:text="${submission.submittedAt}">2026-08-04T15:00</td>
                    <td>
                        <span th:if="${submission.mark != null}"
                              th:text="${submission.mark.marksAwarded + ' / ' + submission.assignment.maxMarks}">18 / 20</span>
                        <span th:if="${submission.mark == null}" class="empty-text">Not graded yet</span>
                    </td>
                    <td>
                        <span th:if="${submission.mark != null}" th:text="${submission.mark.feedback ?: 'No feedback.'}">Good work</span>
                        <span th:if="${submission.mark == null}" class="empty-text">Not graded yet</span>
                    </td>
                    <td>
                        <a th:if="${submission.originalFileName != null}"
                           th:href="@{/files/submissions/{id}(id=${submission.id})}"
                           th:text="${submission.originalFileName}">answer.pdf</a>
                        <span th:if="${submission.originalFileName == null}" class="empty-text">No file</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(submissions)}">
                    <td colspan="6" class="empty-text">No submissions found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
