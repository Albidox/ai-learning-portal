<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">My Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="page-panel">
        <div class="page-header">
            <div>
                <p class="small-label">Student</p>
                <h1>My Courses</h1>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="action-grid">
            <a class="action-card"
               th:each="enrollment : ${enrollments}"
               th:href="@{/student/courses/{id}/lessons(id=${enrollment.course.id})}">
                <strong th:text="${enrollment.course.name}">Java Basics</strong>
                <span th:text="${enrollment.course.description ?: 'No description added.'}">Course description</span>
                <span class="status-line" th:text="'Status: ' + ${enrollment.status}">Status: ACTIVE</span>
            </a>
        </div>

        <p th:if="${#lists.isEmpty(enrollments)}" class="empty-text">
            You are not enrolled in any active course yet.
        </p>
    </section>
</main>
</body>
</html>
