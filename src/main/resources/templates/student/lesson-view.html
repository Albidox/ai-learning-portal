<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Lesson</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="page-panel lesson-panel">
        <div class="page-header">
            <div>
                <p class="small-label" th:text="${lesson.subject.course.name}">Course name</p>
                <h1 th:text="${lesson.title}">Lesson title</h1>
            </div>
            <div class="button-row">
                <a class="primary-button inline-button"
                   th:href="@{/student/lessons/{id}/ai(id=${lesson.id})}">AI Notes</a>
                <a class="secondary-button inline-button"
                   th:href="@{/student/courses/{id}/lessons(id=${lesson.subject.course.id})}">Back</a>
            </div>
        </div>

        <div class="lesson-meta">
            <span th:text="'Subject: ' + ${lesson.subject.name}">Subject: Spring Boot</span>
            <span th:text="'Teacher: ' + ${lesson.teacher.name}">Teacher: Teacher User</span>
            <span th:text="'Published: ' + ${lesson.publishedAt}">Published: 2026-08-04T14:00</span>
        </div>

        <article class="lesson-content" th:text="${lesson.content}">
            Lesson content will show here.
        </article>
    </section>
</main>
</body>
</html>
