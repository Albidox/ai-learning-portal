<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Create Enrollment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="auth-panel">
        <p class="small-label">Admin</p>
        <h1>Create Enrollment</h1>

        <form th:action="@{/admin/enrollments}" th:object="${enrollmentRequest}" method="post" class="form-stack">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Enrollment error</div>
            </div>

            <div>
                <label for="courseId" class="form-label">Course</label>
                <select id="courseId" th:field="*{courseId}" class="form-select" required>
                    <option value="">Select course</option>
                    <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.name}">Java Basics</option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('courseId')}" th:errors="*{courseId}"></div>
            </div>

            <div>
                <label for="studentId" class="form-label">Student</label>
                <select id="studentId" th:field="*{studentId}" class="form-select" required>
                    <option value="">Select student</option>
                    <option th:each="student : ${students}" th:value="${student.id}" th:text="${student.name + ' - ' + student.email}">Student User</option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></div>
            </div>

            <div class="button-row">
                <button type="submit" class="primary-button">Enroll Student</button>
                <a class="secondary-button" th:href="@{/admin/enrollments}">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
