<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Create Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="auth-panel">
        <p class="small-label">Admin</p>
        <h1>Create Course</h1>

        <form th:action="@{/admin/courses}" th:object="${courseRequest}" method="post" class="form-stack">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Course error</div>
            </div>

            <div>
                <label for="name" class="form-label">Course Name</label>
                <input id="name" type="text" th:field="*{name}" class="form-control" required>
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div>
                <label for="description" class="form-label">Description</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
                <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="row g-3">
                <div class="col-md-6">
                    <label for="startDate" class="form-label">Start Date</label>
                    <input id="startDate" type="date" th:field="*{startDate}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label for="endDate" class="form-label">End Date</label>
                    <input id="endDate" type="date" th:field="*{endDate}" class="form-control">
                </div>
            </div>

            <div class="field-error" th:if="${#fields.hasErrors('dateRangeValid')}" th:errors="*{dateRangeValid}"></div>

            <label class="checkbox-row">
                <input type="checkbox" th:field="*{active}">
                <span>Course is active</span>
            </label>

            <div class="button-row">
                <button type="submit" class="primary-button">Save Course</button>
                <a class="secondary-button" th:href="@{/admin/courses}">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
