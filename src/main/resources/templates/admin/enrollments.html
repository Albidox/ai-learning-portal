<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Enrollments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{common/navbar :: nav}"></div>

<main class="container py-5">
    <section class="page-panel">
        <div class="page-header">
            <div>
                <p class="small-label">Admin</p>
                <h1>Enrollments</h1>
            </div>
            <a class="primary-button inline-button" th:href="@{/admin/enrollments/new}">New Enrollment</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Course</th>
                    <th>Student</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Enrolled At</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="enrollment : ${enrollments}">
                    <td th:text="${enrollment.course.name}">Java Basics</td>
                    <td th:text="${enrollment.student.name}">Student User</td>
                    <td th:text="${enrollment.student.email}">student@example.test</td>
                    <td th:text="${enrollment.status}">ACTIVE</td>
                    <td th:text="${enrollment.enrolledAt}">2026-08-04T14:00</td>
                </tr>
                <tr th:if="${#lists.isEmpty(enrollments)}">
                    <td colspan="5" class="empty-text">No enrollments found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
