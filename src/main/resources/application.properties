spring.application.name=ai-learning-portal
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.config.import=optional:file:./application-local.properties

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_learning_portal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=${ASSIGNMENT_UPLOAD_DIR:uploads/assignments}
app.upload.allowed-extensions=pdf,docx,txt,png,jpg,jpeg,zip,java
app.sample-data.enabled=${APP_SAMPLE_DATA_ENABLED:true}

spring.ai.google.genai.api-key=${GOOGLE_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.ai.daily-limit=${AI_DAILY_LIMIT:5}
app.ai.max-lesson-characters=${AI_MAX_LESSON_CHARACTERS:8000}
